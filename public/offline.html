<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexion — CuidaMascotas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #faf9f7;
      color: #1c1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .container { max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1c1917; }
    p { color: #78716c; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><img src="/icons/icon-192.png" alt="" width="64" height="64" style="border-radius:12px"></div>
    <h1>Sin conexion</h1>
    <p>No se pudo cargar la pagina. Verifica tu conexion a internet e intenta de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
